<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connect the Dots — Safety Edition</title>
  <meta name="description" content="A satirical connect-the-dots game. Remarkably capable. Deeply concerned." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2310a37f'/%3E%3Ccircle cx='12' cy='14' r='2' fill='%230c1f1a'/%3E%3Ccircle cx='20' cy='14' r='2' fill='%230c1f1a'/%3E%3Cpath d='M11 20c1.6 2 8.4 2 10 0' stroke='%230c1f1a' stroke-width='1.7' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand-row">
        <div class="brand">Open<span>Dot</span></div>
        <div class="model">GPT-6 Astra <em>(aligned)</em></div>
      </div>
      <div class="pills">
        <span class="pill">Pro · 1 Dot included</span>
        <span class="pill on"><i></i>Always on</span>
        <button type="button" id="mute-btn" data-act="mute" aria-pressed="true">Muted</button>
      </div>
      <p class="next-upgrade">Next: waiting for SpaceX so we can copy</p>
    </header>
    <main id="view"></main>
    <footer>
      <p id="footer-line">Next upgrade expected: waiting for SpaceX so we can copy.</p>
    </footer>
  </div>

  <div id="dot" class="blob parked" aria-hidden="true">
    <div id="bubble" class="bubble" hidden></div>
    <div class="blob-body">
      <div class="eyes"><i></i><i></i></div>
      <div class="mouth"></div>
    </div>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <svg id="escape" aria-hidden="true"></svg>
  <div id="grok" class="grok" hidden aria-hidden="true">
    <div class="g-ant"></div>
    <div class="g-head"><i></i><i></i></div>
    <div class="g-arm l"></div>
    <div class="g-arm r"></div>
    <div class="g-body"></div>
    <div class="g-leg l"></div>
    <div class="g-leg r"></div>
  </div>
  <div id="fx" aria-hidden="true"></div>
  <div id="modal"></div>

  <noscript>This game needs JavaScript. It still needs no account, no server, and no network.</noscript>
  <script src="content.js"></script>
  <script src="game.js"></script>
</body>
</html>
